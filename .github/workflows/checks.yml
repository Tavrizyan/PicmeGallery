name: Gallery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/PicmeGallery.Checks -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/worker-checks.mjs
      - run: dotnet publish src/PicmeGallery.Web -c Release -o artifacts/publish
