<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#251b62">
  <title>Your event · PICME</title>
  <link rel="icon" type="image/png" href="/brand/favicon-32x32.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon-152x152.png">
  <link rel="stylesheet" href="/gallery.css"><link rel="stylesheet" href="/events.css"><script src="/event.js" defer></script>
</head>
<body id="top">
  <div class="hero event-hero"><div class="wallpaper-lights" aria-hidden="true"></div><header class="site-header"><a class="brand" href="https://picme.am" aria-label="PICME home"><img src="/brand/picme_logo_whitescale.svg" alt="PICME" width="156" height="59"></a><span class="header-note">EVENT GALLERY</span></header><section class="intro"><h1 id="event-title">Your event</h1></section></div>
  <main class="owner-main"><div class="section-heading owner-heading"><div><h2>Photos</h2><p id="session-count" class="count"></p></div><div class="actions"><button id="refresh-event" class="secondary compact" type="button">Refresh gallery</button><a id="download-all" class="button compact" hidden>Download all photos (.zip)</a></div></div>
    <p id="event-status" class="page-status" role="status" aria-live="polite">Opening the event gallery…</p>
    <section id="event-empty" class="waiting" hidden><h2>No photos yet</h2><p>Photos will appear here after upload.</p></section>
    <div id="event-photos" class="photo-grid" aria-label="Finished event photos"></div><div class="load-more"><button id="more-photos" class="secondary compact" type="button" hidden>Load more</button></div>
  </main>
  <footer class="gallery-footer">
    <div class="footer-inner">
      <div class="footer-brand"><a class="brand" href="https://picme.am" aria-label="Visit PICME"><img src="/brand/picme_logo_colour.svg" alt="PICME" width="132" height="50"></a><span>Yerevan, Armenia</span></div>
      <address class="footer-contact"><a href="tel:+37494932053">+374 94 93 20 53</a><a href="mailto:info@picme.am">info@picme.am</a></address>
      <nav class="footer-social" aria-label="Social media"><a href="https://www.facebook.com">Facebook </a><a href="https://www.instagram.com">Instagram </a></nav>
      <div class="footer-bottom"><a href="https://picme.am">picme.am </a><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
    </div>
  </footer>
  <dialog id="event-preview" aria-labelledby="event-preview-title"><div class="preview-toolbar"><h2 id="event-preview-title">Finished print</h2><button id="close-event-preview" class="icon-button" type="button" aria-label="Close preview" autofocus>×</button></div><div class="preview-stage"><img id="event-preview-image" alt="Finished photobooth print"></div><div class="preview-bottom"><div class="actions"><a id="preview-final-download" class="button secondary compact"><img class="download-icon" src="/icons/download.svg" alt="" width="20" height="20">Download final</a><a id="preview-session" class="button compact">All session photos</a></div><p id="event-preview-status" class="subtext" role="status"></p></div></dialog>
</body>
</html>
