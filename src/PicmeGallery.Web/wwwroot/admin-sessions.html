<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#251b62">
  <title>Manage event sessions · PICME</title>
  <link rel="icon" type="image/png" href="/brand/favicon-32x32.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon-152x152.png">
  <link rel="stylesheet" href="/gallery.css"><link rel="stylesheet" href="/events.css"><script src="/admin-sessions.js" defer></script>
</head>
<body class="admin-page">
  <header class="site-header admin-header"><a class="brand" href="/admin" aria-label="PICME administration"><img src="/brand/picme_logo_colour.svg" alt="PICME" width="140" height="53"></a><a class="button secondary compact" href="/admin">Back to events</a></header>
  <main class="session-management">
    <p class="eyebrow">CHOOSE WHAT THE ORGANIZER SEES</p><h1 id="sessions-title">Manage sessions</h1><p id="managed-event-id" class="count"></p>
    <p class="subtext">Hide a session from the event owner’s gallery and downloads. The guest’s printed QR keeps working.</p>
    <div class="session-tools"><div><label for="session-filter">Show sessions</label><select id="session-filter"><option value="all">All sessions</option><option value="visible">Visible to owner</option><option value="hidden">Hidden from owner</option></select></div><span id="hidden-count" class="count"></span><button id="refresh-sessions" class="secondary compact" type="button">Refresh sessions</button></div>
    <p id="sessions-status" class="page-status" role="status" aria-live="polite">Opening event sessions…</p>
    <p id="no-sessions" class="subtext" hidden>No sessions match this view. Newly uploaded photos may take a short time to appear.</p>
    <div id="managed-sessions" class="photo-grid" aria-label="Event sessions"></div><div class="load-more"><button id="more-sessions" class="secondary compact" type="button" hidden>Load more sessions</button></div>
  </main>
  <dialog id="session-preview" aria-labelledby="session-preview-title"><div class="preview-toolbar"><h2 id="session-preview-title">Finished print</h2><button id="close-session-preview" class="icon-button" type="button" aria-label="Close preview" autofocus>×</button></div><div class="preview-stage"><img id="session-preview-image" alt="Finished photobooth print"></div><div class="preview-bottom"><p id="session-preview-status" class="subtext" role="status"></p></div></dialog>
</body>
</html>
